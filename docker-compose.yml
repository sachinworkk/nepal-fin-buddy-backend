services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: finbuddy
      POSTGRES_PASSWORD: finbuddy
      POSTGRES_DB: finbuddy
    ports: ["5433:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finbuddy"]
      interval: 3s
      retries: 20

  mock-prize:
    build: .
    command: uvicorn mock_prize.app:app --host 0.0.0.0 --port 8002
    ports: ["8002:8002"]

  api:
    build: .
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://finbuddy:finbuddy@db:5432/finbuddy
      PRIZE_MOCK_URL: http://mock-prize:8002/api/v1
      STORAGE_DIR: /data/storage
      HF_HOME: /data/hf
    ports: ["8000:8000"]
    volumes: [appdata:/data]
    depends_on:
      db: {condition: service_healthy}

volumes:
  dbdata:
  appdata: