services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: finbuddy
      POSTGRES_PASSWORD: finbuddy
      POSTGRES_DB: finbuddy
    ports: ["5433:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finbuddy"]
      interval: 3s
      retries: 20

  mock-cbms:
    build: .
    command: uvicorn mock_cbms.app:app --host 0.0.0.0 --port 8001
    ports: ["8001:8001"]

  api:
    build: .
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://finbuddy:finbuddy@db:5432/finbuddy
      CBMS_MOCK_URL: http://mock-cbms:8001
      STORAGE_DIR: /data/storage
      HF_HOME: /data/hf
    ports: ["8000:8000"]
    volumes: [appdata:/data]
    depends_on:
      db: {condition: service_healthy}

  worker:
    build: .
    command: python -m app.worker.sync
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://finbuddy:finbuddy@db:5432/finbuddy
      CBMS_MOCK_URL: http://mock-cbms:8001
    depends_on:
      db: {condition: service_healthy}
      mock-cbms: {condition: service_started}

volumes:
  dbdata:
  appdata:
